name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:chrome
      - run: pnpm build:firefox
      - name: Generate changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%an)" --reverse > CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create zip packages
        run: |
          cd dist/chrome && zip -r ../legado-source-generator-chrome-${{ github.ref_name }}.zip . && cd ../..
          cd dist/firefox && zip -r ../legado-source-generator-firefox-${{ github.ref_name }}.zip . && cd ../..
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/legado-source-generator-chrome-${{ github.ref_name }}.zip
            dist/legado-source-generator-firefox-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false